spring.datasource.url=jdbc:mysql://db:3306/cmsdb
spring.datasource.username=root
spring.datasource.password=rootpassword
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# we will use the provided SQL to create schema; do not let Hibernate auto-create
spring.jpa.hibernate.ddl-auto=none

# show SQL during development
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect


spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB
server.tomcat.max-swallow-size=-1
logging.level.org.springframework.web=DEBUG
# Ensure the app can resolve the multipart request properly
spring.mvc.pathmatch.matching-strategy=ant_path_matcher
server.port=8080
