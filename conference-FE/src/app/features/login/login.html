<div class="split-container">
  <div class="visual-side">
    <div class="branding">
      <mat-icon>school</mat-icon>
      <span>ConfEase</span>
    </div>

    <div class="visual-text">
      <h1>Seamless Conference Management.</h1>
      <p>The premier platform for academic submissions and global networking.</p>
    </div>
  </div>

  <div class="form-side">
    <div class="form-content">
      <header>
        <h2>Login</h2>
        <p>Enter your account details below.</p>
      </header>

      <form [formGroup]="loginForm" (ngSubmit)="onLogin()">
        <mat-form-field appearance="outline">
          <mat-label>Email Address</mat-label>
          <input matInput formControlName="email" type="email">
          <mat-icon matSuffix>mail</mat-icon>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Password</mat-label>
          <input matInput [type]="hidePassword ? 'password' : 'text'" formControlName="password_hash">
          <button mat-icon-button matSuffix (click)="hidePassword = !hidePassword" type="button">
            <mat-icon>{{hidePassword ? 'visibility_off' : 'visibility'}}</mat-icon>
          </button>
        </mat-form-field>

        <button mat-flat-button class="login-btn" [disabled]="loginForm.invalid">
          CONTINUE
        </button>
      </form>

      <footer>
        Don't have an account? <a routerLink="/register">Register</a>
      </footer>
    </div>
  </div>
</div>
